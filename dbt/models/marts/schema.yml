version: 2

models:
  - name: dim_date
    description: "Date dimension spanning 1871–2050 with rugby-specific flags"
    columns:
      - name: date_id
        description: "Surrogate key in YYYYMMDD integer format"
        data_tests:
          - unique
          - not_null
      - name: full_date
        description: "Calendar date"
        data_tests:
          - unique
          - not_null
      - name: year_number
        data_tests:
          - not_null
      - name: month_number
        data_tests:
          - not_null
      - name: day_number
        data_tests:
          - not_null
      - name: day_of_week
        data_tests:
          - not_null
      - name: is_world_cup_year
        data_tests:
          - not_null

  - name: fct_head_to_head
    description: "One row per team per match (mirrored grain). Join team_sk/opponent_sk to dim_team."
    columns:
      - name: match_date_sk
        description: "Foreign key to dim_date.date_id"
        data_tests:
          - not_null
      - name: team_sk
        description: "Foreign key to dim_team (the reference team's perspective)"
        data_tests:
          - not_null
      - name: opponent_sk
        description: "Foreign key to dim_team (the opposing team)"
        data_tests:
          - not_null
      - name: stadium_sk
        description: "Foreign key to dim_stadium.stadium_id"
        data_tests:
          - not_null
      - name: points_for
        description: "Points scored by the reference team"
        data_tests:
          - not_null
      - name: points_against
        description: "Points scored against the reference team"
        data_tests:
          - not_null
